<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Selkies Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Selkies Client</h1>
    <div class="spacer"></div>
    <button id="settings-btn" class="ghost" title="Global settings (defaults for all profiles)">⚙ Settings</button>
  </header>
  <main>
    <div id="hooks-banner" class="banner info" hidden></div>
    <div id="error-banner" class="banner" hidden></div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="hint" hidden>No computer yet. Click “Add” to create your first profile.</p>
  </main>
  <footer id="footer"></footer>
  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <script src="app.js"></script>
</body>
</html>
